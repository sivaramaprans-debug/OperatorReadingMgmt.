name: operator_reading_mgmt
description: Operator Reading Management System — offline-first two-role app.
publish_to: 'none'
version: 1.4.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.3

  # Database — local (Drift/SQLite kept for migration period)
  drift: ^2.23.1
  drift_flutter: 0.2.4
  sqlite3_flutter_libs: ^0.5.25

  # Cloud Database
  supabase_flutter: ^2.8.4

  # Code generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Security
  flutter_secure_storage: ^9.2.4

  # Utilities
  uuid: ^4.5.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  intl: ^0.20.2

  # Password hashing
  bcrypt: ^1.1.3

  # UI
  google_fonts: ^6.3.2
  excel: ^4.0.6
  pdf: ^3.11.3
  file_picker: ^11.0.3
  url_launcher: ^6.3.1
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.23.1
  freezed: ^2.5.7
  riverpod_generator: ^2.6.2
  json_serializable: ^6.8.0
  custom_lint: ^0.7.3
  riverpod_lint: ^2.4.0

  # Testing
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
